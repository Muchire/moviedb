{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 mt-16 space-y-4 rounded-lg shadow-md bg-white">
    <h2 class="text-2xl font-bold text-center text-gray-700">Login to MovieDB</h2>
    
    <form method="POST" class="space-y-6">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700">User name</label>
        {{ form.username }}
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700">Password</label>
        {{ form.password }}
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-start">
            <div class="flex items-center h-5">
              <input id="remember" type="checkbox" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300">
            </div>
            <div class="ml-3 text-sm">
              <label for="remember" class="text-gray-600">Remember me</label>
            </div>
        </div>
        <a href="{% url 'password_reset' %}" class="text-sm font-medium text-blue-600 hover:underline">Forgot password?</a>
      </div>
      <a href="{% url 'index'%}" type="submit" class="w-full px-4 py-2 font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300">
        Login
      </a>
    </form>
    
    <p class="text-sm text-center text-gray-600">
      Don't have an account?
      <a href="{% url 'authView' %}" class="text-blue-600 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock content %}
