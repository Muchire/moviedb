{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 mt-16 space-y-4 rounded-lg shadow-md bg-white">
    <h2 class="text-2xl font-bold text-center text-gray-700">Sign Up for MovieDB</h2>
    
    <form method="POST" class="space-y-6">
      {% csrf_token %}
      
      <!-- Adjust the field names based on your signup form fields -->
      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700">Username</label>
        {{ form.username }}
      </div>
      
      <div>
        <label for="id_email" class="block text-sm font-medium text-gray-700">Email</label>
        {{ form.email }}
      </div>
      
      <div>
        <label for="id_password1" class="block text-sm font-medium text-gray-700">Password</label>
        {{ form.password1 }}
      </div>
      
      <div>
        <label for="id_password2" class="block text-sm font-medium text-gray-700">Confirm Password</label>
        {{ form.password2 }}
      </div>
      
      <button type="submit" class="w-full px-4 py-2 font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300">
        Sign Up
      </button>
    </form>
    
    <p class="text-sm text-center text-gray-600">
      Already have an account?
      <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock content %}
